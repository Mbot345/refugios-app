{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<article class="auth-card login-section">
  <span class="auth-card__icon">{{ icono('entrar') }}</span>
  <h1 class="auth-card__title login-section__title">Iniciar sesión</h1>
  <p class="auth-card__text">Entra para enviar solicitudes y seguir su estado.</p>
  <form class="login-section__form" method="post" action="/login">
    <label class="login-section__label">Usuario
      <input class="login-section__input login-section__input--username" type="text" name="username"
             value="{{ username or '' }}" autocomplete="username" required autofocus>
    </label>
    <label class="login-section__label">Contraseña
      <input class="login-section__input login-section__input--password" type="password" name="password"
             autocomplete="current-password" required>
    </label>
    <button class="login-section__button" type="submit">Entrar</button>
  </form>
  <p class="auth-card__footer login-section__footer">¿No tienes cuenta? <a class="login-section__link" href="/registro">Crea una aquí</a></p>
</article>
{% endblock %}
