{% extends "base.html" %}
{% block title %}Registro{% endblock %}
{% block content %}
<article class="auth-card register-section">
  <span class="auth-card__icon">{{ icono('registro') }}</span>
  <h1 class="auth-card__title register-section__title">Crear cuenta</h1>
  <p class="auth-card__text">Con tu cuenta puedes solicitar la preadopción de un animal.</p>
  <form class="register-section__form" method="post" action="/registro">
    <label class="register-section__label">Usuario
      <input class="register-section__input register-section__input--username" type="text" name="username"
             value="{{ username or '' }}" autocomplete="username" required autofocus>
    </label>
    <label class="register-section__label">Correo
      <input class="register-section__input register-section__input--email" type="email" name="email"
             value="{{ email or '' }}" autocomplete="email" required>
    </label>
    <label class="register-section__label">Contraseña
      <input class="register-section__input register-section__input--password" type="password" name="password"
             autocomplete="new-password" aria-describedby="ayuda-clave" required>
      <small id="ayuda-clave">Mínimo 8 caracteres.</small>
    </label>
    <label class="register-section__label">Repetir contraseña
      <input class="register-section__input register-section__input--password2" type="password" name="password2"
             autocomplete="new-password" required>
    </label>
    <button class="register-section__button" type="submit">Crear cuenta</button>
  </form>
  <p class="auth-card__footer register-section__footer">¿Ya tienes cuenta? <a class="register-section__link" href="/login">Inicia sesión</a></p>
</article>
{% endblock %}
