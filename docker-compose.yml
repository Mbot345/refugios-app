services:
  db:
    image: postgres:16
    container_name: refugios_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: refugios_user
      POSTGRES_PASSWORD: refugios_pass
      POSTGRES_DB: refugios_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: